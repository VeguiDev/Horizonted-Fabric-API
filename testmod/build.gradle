plugins {
    id 'java'
    id("io.canvasmc.weaver.userdev") version "2.3.12"
    id("io.canvasmc.horizon")
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'dev.vegui.hfa.testmod'
version = '1.0.0-SNAPSHOT'

def bundledModules = [
    ":fabric-api-base",
    ":fabric-command-api-v2",
    ":fabric-content-registries-v0",
    ":fabric-lifecycle-events-v1",
    ":fabric-registry-sync-v0",
    ":fabric-resource-loader-v0",
    ":fabric-networking-api-v1"
]

repositories {

}

dependencies {
    bundledModules.each {
        compileOnly project(it)
    }

    runtimePlugin(project(":")) {
        transitive = false
    }
}

tasks.named("runServer") {
    doFirst {
        def serverProperties = file("run/server.properties")

        if (serverProperties.exists()) {
            def text = serverProperties.getText("UTF-8")

            if (text.contains("debug=false")) {
                serverProperties.setText(text.replace("debug=false", "debug=true"), "UTF-8")
            } else if (!text.contains("debug=true")) {
                serverProperties.append("${System.lineSeparator()}debug=true${System.lineSeparator()}", "UTF-8")
            }
        }

        def spigotYml = file("run/spigot.yml")

        if (spigotYml.exists()) {
            def text = spigotYml.getText("UTF-8")

            if (text.contains("  debug: false")) {
                spigotYml.setText(text.replace("  debug: false", "  debug: true"), "UTF-8")
            }
        }
    }
}
